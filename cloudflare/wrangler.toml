name = "yantu-midian"
main = "worker/index.js"
compatibility_date = "2026-01-01"

# 静态资源（游戏本体）：由 scripts/cf_deploy.mjs 从仓库根目录同步进来
[assets]
directory = "./public"
binding = "ASSETS"

# D1 数据库
[[d1_databases]]
binding = "DB"
database_name = "ytm-db"
database_id = "bc9a58d6-a1df-4f66-b2ef-ed8a282f1031"

# 观测（免费额度内）
[observability]
enabled = true
