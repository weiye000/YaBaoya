<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06060f">
  <meta name="description" content="研途秘典 · 你的保研之路，究竟会通向哪里？一款关于保研、塔罗与命运叙事的轻量娱乐网页游戏。">
  <title>研途秘典 · 你的保研之路，究竟会通向哪里？</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b1c'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23c9a45c' font-family='serif'%3E%E7%A0%94%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/styles/global.css">
  <link rel="stylesheet" href="src/styles/home.css">
  <link rel="stylesheet" href="src/styles/cards.css">
  <link rel="stylesheet" href="src/styles/screens.css">
  <link rel="stylesheet" href="src/styles/result.css">
</head>
<body>
  <!-- 星空背景 -->
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- 顶栏 -->
  <header class="topbar">
    <button id="btn-sound" class="topbar-btn" type="button" title="声音开关" aria-label="声音开关">
      <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8a5 5 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <button id="btn-history" class="topbar-btn" type="button" title="命运簿" aria-label="命运簿">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6.5C10.2 4.9 7.6 4.4 4.5 4.7v13.4c3.1-.3 5.7.2 7.5 1.8 1.8-1.6 4.4-2.1 7.5-1.8V4.7c-3.1-.3-5.7.2-7.5 1.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M12 6.5v13.4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <button id="btn-wish" class="topbar-btn" type="button" title="心事墙" aria-label="心事墙">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.3 4.7 5.2.7-3.8 3.7.9 5.2L12 15.5l-4.6 2.4.9-5.2L4.5 9l5.2-.7L12 3.6z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <!-- 页面容器 -->
  <main id="screens">
    <section class="screen" id="screen-home" aria-label="首页"></section>
    <section class="screen" id="screen-gate" aria-label="选择身份"></section>
    <section class="screen" id="screen-admin" aria-label="管理台"></section>
    <section class="screen" id="screen-theme" aria-label="选择占卜主题"></section>
    <section class="screen" id="screen-question" aria-label="写下你的问题"></section>
    <section class="screen" id="screen-spread" aria-label="选择牌阵"></section>
    <section class="screen" id="screen-draw" aria-label="抽牌仪式"></section>
    <section class="screen" id="screen-result" aria-label="占卜结果"></section>
  </main>

  <!-- 分享卡弹窗 -->
  <div class="modal" id="modal-share" hidden>
    <div class="modal-backdrop" data-close="modal-share"></div>
    <div class="modal-panel modal-panel-share" role="dialog" aria-modal="true" aria-label="生成我的研途命运卡">
      <button class="modal-close" type="button" data-close="modal-share" aria-label="关闭">✕</button>
      <h3 class="modal-title">我的研途命运卡</h3>
      <div class="share-canvas-wrap">
        <canvas id="share-canvas"></canvas>
      </div>
      <p class="share-hint">手机端可<span class="u-gold">长按图片保存</span>到相册</p>
      <div class="share-actions">
        <button id="btn-share-download" class="btn btn-primary" type="button">保存图片</button>
        <button id="btn-share-copy" class="btn btn-ghost" type="button">复制图片</button>
      </div>
    </div>
  </div>

  <!-- 命运簿 / 图鉴弹窗 -->
  <div class="modal" id="modal-history" hidden>
    <div class="modal-backdrop" data-close="modal-history"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="命运簿">
      <button class="modal-close" type="button" data-close="modal-history" aria-label="关闭">✕</button>
      <h3 class="modal-title">研途秘典</h3>
      <div class="history-tabs" id="history-tabs">
        <button class="history-tab selected" type="button" data-tab="list">命运簿</button>
        <button class="history-tab" type="button" data-tab="collection">研途图鉴</button>
      </div>
      <div id="history-list" class="history-list"></div>
      <div id="collection-body" class="collection-body" hidden></div>
      <div id="history-actions"></div>
    </div>
  </div>

  <!-- 心事墙弹窗 -->
  <div class="modal" id="modal-wish" hidden>
    <div class="modal-backdrop" data-close="modal-wish"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="心事墙">
      <button class="modal-close" type="button" data-close="modal-wish" aria-label="关闭">✕</button>
      <h3 class="modal-title">研途心事墙</h3>
      <div id="wish-body"></div>
    </div>
  </div>

  <!-- 云账户弹窗 -->
  <div class="modal" id="modal-account" hidden>
    <div class="modal-backdrop" data-close="modal-account"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-label="云同步账户">
      <button class="modal-close" type="button" data-close="modal-account" aria-label="关闭">✕</button>
      <h3 class="modal-title">云同步 · 同步码</h3>
      <div id="account-body"></div>
    </div>
  </div>

  <!-- 数据层 -->
  <script src="src/data/cards.js"></script>
  <script src="src/data/spreads.js"></script>
  <script src="src/data/questions.js"></script>
  <script src="src/data/tips.js"></script>
  <!-- 游戏逻辑层 -->
  <script src="src/game/random.js"></script>
  <script src="src/game/draw.js"></script>
  <script src="src/game/interpretation.js"></script>
  <!-- 后端（可选：不配置时自动单机模式） -->
  <script src="src/config.backend.js"></script>
  <script src="src/backend/local.js"></script>
  <script src="src/backend/worker.js"></script>
  <script src="src/backend/cloudbase.js"></script>
  <script src="src/backend/adapter.js"></script>
  <!-- 展示层 -->
  <script src="src/ui/starfield.js"></script>
  <script src="src/ui/sound.js"></script>
  <script src="src/ui/storage.js"></script>
  <script src="src/ui/cards-ui.js"></script>
  <script src="src/ui/share.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
